<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DLNA 电视模拟器</title>
<style>
  :root{
    --bg:#080b10; --panel:#11161d; --panel2:#161d26; --line:#232c38;
    --text:#e7edf5; --dim:#8b98a9; --accent:#4c9aff; --ok:#39d98a; --warn:#ffb020; --err:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;justify-content:space-between;align-items:center;gap:16px;
    padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
  .brand{display:flex;align-items:center;gap:10px;font-size:16px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .meta{color:var(--dim);font-size:12px;text-align:right;line-height:1.6}
  main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:18px 20px}
  @media(max-width:900px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
  .screen-wrap{position:relative;border-radius:12px;overflow:hidden;background:#04070c;
    border:1px solid var(--line);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .screen-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
  .idle{text-align:center;color:var(--dim)}
  .idle .tv{font-size:46px;margin-bottom:10px;opacity:.8}
  .idle .hint{font-size:12px;color:#5d6b7d;margin-top:6px}
  .caption{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:24px}
  .badge{font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:6px;
    background:#1d2836;color:var(--dim);border:1px solid var(--line);white-space:nowrap}
  .badge.playing{color:var(--ok);border-color:#1f4d3a;background:#0f2418}
  .badge.paused{color:var(--warn);border-color:#4d3d16;background:#241d0b}
  .badge.transitioning{color:var(--accent);border-color:#1e3a5c;background:#0d1a2b}
  .title{font-size:13px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .progress{height:4px;background:#1a222d;border-radius:3px;margin-top:10px;overflow:hidden}
  .progress>div{height:100%;width:0;background:linear-gradient(90deg,#2f6fd0,#4c9aff);transition:width .3s}
  .times{display:flex;justify-content:space-between;color:var(--dim);font-size:11px;margin-top:6px;
    font-variant-numeric:tabular-nums}
  .remote label{display:block;color:var(--dim);font-size:12px;margin:14px 0 6px}
  .row{display:flex;gap:8px}
  button{flex:1;padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);font-size:13px;cursor:pointer;transition:.15s}
  button:hover{background:#1e2833;border-color:#31404f}
  button.primary{background:linear-gradient(180deg,#2f6fd0,#245bb0);border-color:#2f6fd0;color:#fff}
  button.primary:hover{filter:brightness(1.1)}
  input[type=text],input[type=range]{width:100%}
  input[type=text]{padding:10px 12px;border-radius:9px;border:1px solid var(--line);
    background:#0c1118;color:var(--text);font-size:13px}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:#233041;outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--accent);cursor:pointer;box-shadow:0 0 6px rgba(76,154,255,.6)}
  .vol-row{display:flex;align-items:center;gap:10px}
  .vol-row span{color:var(--dim);font-size:12px;min-width:56px;text-align:right}
  .stats{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:8px;color:var(--dim);font-size:12px}
  .stats b{color:var(--text);font-weight:500}
  .logs{padding:0 20px 24px}
  .loghead{color:var(--dim);font-size:12px;margin-bottom:8px;display:flex;justify-content:space-between}
  pre#log{margin:0;height:190px;overflow:auto;background:#05080d;border:1px solid var(--line);
    border-radius:12px;padding:12px;font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9fb0c4}
  pre#log .t{color:#54657a}
  pre#log .k{display:inline-block;min-width:52px;color:#6f8bab}
  pre#log .k.ssdp{color:#7dd3a0} pre#log .k.soap{color:#79b8ff}
  pre#log .k.gena{color:#c39bff} pre#log .k.screen{color:#ffcc66}
  pre#log .k.media{color:#66d9c0} pre#log .k.proxy{color:#ff9f7a}
  .mute{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:12px;margin-top:10px}
  .mute input{width:auto}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span><b id="name">DLNA 电视</b></div>
  <div class="meta">
    <div id="addr">—</div>
    <div id="uuid">—</div>
  </div>
</header>

<main>
  <section class="card">
    <div class="screen-wrap">
      <video id="preview" playsinline muted></video>
      <div class="idle" id="idle">
        <div class="tv">📺</div>
        <div>等待投屏…</div>
        <div class="hint">在手机视频 App 里点“投屏”，选中这台电视</div>
      </div>
    </div>
    <div class="caption">
      <span class="badge" id="state">NO_MEDIA_PRESENT</span>
      <span class="title" id="title"></span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="times"><span id="pos">00:00:00</span><span id="dur">00:00:00</span></div>
  </section>

  <aside class="card remote">
    <div class="row">
      <button data-act="play" class="primary">▶ 播放</button>
      <button data-act="pause">⏸ 暂停</button>
      <button data-act="stop">⏹ 停止</button>
    </div>

    <label>音量 <span id="volLabel" style="color:var(--text)">30</span></label>
    <div class="vol-row">
      <input id="vol" type="range" min="0" max="100" step="1">
      <span id="volPct">30%</span>
    </div>
    <label class="mute"><input id="mute" type="checkbox"> 静音</label>

    <label>进度</label>
    <input id="seek" type="range" min="0" max="1000" step="1" value="0">

    <label>投个地址进来（模拟手机投屏）</label>
    <input id="castUrl" type="text" placeholder="https://…/index.m3u8 或 .mp4">
    <div class="row" style="margin-top:8px">
      <button id="castBtn" class="primary">投屏</button>
      <button id="clearBtn">断开</button>
    </div>

    <label>设备名</label>
    <div class="row">
      <input id="devName" type="text">
      <button id="renameBtn" style="flex:0 0 76px">改名</button>
    </div>

    <div class="stats">
      <div>播放引擎 <b id="player">—</b></div>
      <div>订阅数 <b id="subs">0</b></div>
      <div>SOAP 调用 <b id="soap">0</b></div>
      <div>M-SEARCH <b id="ms">0</b></div>
      <div style="grid-column:1/-1">拉流 <b id="probe">—</b></div>
    </div>
    <button id="diagBtn" style="margin-top:12px">网络自检（手机搜不到时点这里）</button>
    <pre id="diag" style="display:none;margin:10px 0 0;white-space:pre-wrap;font:11px/1.6 ui-monospace,Menlo,monospace;color:#9fb0c4;background:#05080d;border:1px solid var(--line);border-radius:8px;padding:10px"></pre>
  </aside>
</main>

<section class="logs">
  <div class="loghead"><span>事件流</span><span><a href="/screen" style="color:#6f8bab">全屏播放页 →</a></span></div>
  <pre id="log"></pre>
</section>

<script>
const $ = s => document.querySelector(s);
const STATE_CN = {
  PLAYING:'播放中', PAUSED_PLAYBACK:'已暂停', STOPPED:'已停止',
  NO_MEDIA_PRESENT:'待机', TRANSITIONING:'缓冲中'
};
const CLS = {PLAYING:'playing',PAUSED_PLAYBACK:'paused',TRANSITIONING:'transitioning'};
let lastLogId = 0, seekDragging = false, volDragging = false, lastUri = '';

function fmt(sec){
  sec = Math.max(0, Math.floor(sec||0));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return [h,m,s].map(v=>String(v).padStart(2,'0')).join(':');
}

function render(s){
  $('#name').textContent = s.friendly_name;
  $('#devName').value = s.friendly_name;
  $('#addr').textContent = (s.addresses||[]).map(a=>a+':'+s.port).join('  ·  ') || ('127.0.0.1:'+s.port);
  $('#uuid').textContent = 'uuid:' + s.uuid;
  const st = s.state || 'NO_MEDIA_PRESENT';
  const badge = $('#state');
  badge.textContent = STATE_CN[st] || st;
  badge.className = 'badge ' + (CLS[st] || '');
  $('#title').textContent = s.title || '';
  const perc = s.duration > 0 ? Math.min(100, s.position / s.duration * 100) : 0;
  $('#bar').style.width = perc.toFixed(1) + '%';
  $('#pos').textContent = fmt(s.position);
  $('#dur').textContent = fmt(s.duration);
  if (!volDragging){
    $('#vol').value = s.volume;
    $('#volLabel').textContent = s.volume;
    $('#volPct').textContent = s.volume + '%';
  }
  $('#mute').checked = !!s.mute;
  if (!seekDragging && s.duration > 0){
    $('#seek').value = Math.round(s.position / s.duration * 1000);
  }
  $('#player').textContent = s.player === 'vlc' ? 'VLC 全屏' : '网页';
  $('#subs').textContent = s.subscribers;
  $('#soap').textContent = s.soap_calls;
  $('#ms').textContent = s.msearch;
  const p = s.probe || {};
  $('#probe').textContent = p.status ? (p.status + (p.detail ? ' · ' + p.detail : '') +
     (p.content_type ? ' · ' + p.content_type : '')) : '—';

  // 网页引擎时在这里直接看画面；VLC 引擎下画在 VLC 自己的窗口里
  const v = $('#preview');
  if (s.player === 'web' && s.uri && s.uri !== lastUri){
    lastUri = s.uri;
    v.src = '/proxy?url=' + encodeURIComponent(s.uri);
    v.style.display = 'block';
    $('#idle').style.display = 'none';
  } else if (!s.uri){
    lastUri = '';
    v.removeAttribute('src'); v.load();
    v.style.display = 'none';
    $('#idle').style.display = 'block';
  }
  if (s.state === 'PLAYING' && v.style.display === 'block') { v.play().catch(()=>{}); }
  if (s.state !== 'PLAYING' && v.style.display === 'block') { v.pause(); }
}

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  try { return await r.json(); } catch(e){ return {}; }
}

document.querySelectorAll('button[data-act]').forEach(b=>{
  b.onclick = ()=> post('/api/control', {action: b.dataset.act});
});
$('#vol').oninput = e => {
  volDragging = true;
  $('#volLabel').textContent = e.target.value;
  $('#volPct').textContent = e.target.value + '%';
};
$('#vol').onchange = e => { volDragging = false; post('/api/control', {action:'volume', value:+e.target.value}); };
$('#mute').onchange = e => post('/api/control', {action:'mute', value: e.target.checked ? 1 : 0});
$('#seek').oninput = ()=> seekDragging = true;
$('#seek').onchange = e => {
  seekDragging = false;
  const dur = parseFloat($('#dur').textContent.split(':').reduce((a,t)=>a*60+ +t,0));
  post('/api/control', {action:'seek', value: dur * e.target.value / 1000});
};
$('#castBtn').onclick = async ()=>{
  const url = $('#castUrl').value.trim();
  if (!url) return;
  const r = await post('/api/cast', {url});
  if (r.error) alert('投屏失败: ' + r.error);
};
$('#clearBtn').onclick = ()=> post('/api/control', {action:'clear'});
$('#renameBtn').onclick = async ()=>{
  const name = $('#devName').value.trim();
  if (!name) return;
  await post('/api/config', {friendly_name: name});
};

$('#diagBtn').onclick = async ()=>{
  const box = $('#diag');
  box.style.display = 'block';
  box.textContent = '检查中…';
  const d = await (await fetch('/api/diag')).json();
  const lines = [];
  lines.push('地址：' + (d.addresses || []).join(', ') + ':' + d.port);
  lines.push('组播 239.255.255.250: ' + (d.multicast_ok ? '可以发送' : '发不出去 — ' + d.multicast_err));
  lines.push('子网广播 ' + (d.broadcast_addr || '-') + ': ' + (d.broadcast_ok ? '可以发送' : '发不出去 — ' + d.broadcast_err));
  lines.push('已收到 M-SEARCH：' + d.msearch_count + ' 次');
  if ((d.hints || []).length) { lines.push(''); lines.push(...d.hints); }
  box.textContent = lines.join('\n');
};

const KIND_CN = {ssdp:'发现', soap:'控制', gena:'事件', screen:'屏幕', media:'拉流',
                 proxy:'代理', http:'服务', ui:'界面', config:'配置', avt:'控制', rcs:'音量', vlc:'VLC'};
function appendLog(e){
  const box = $('#log');
  const div = document.createElement('div');
  div.innerHTML = '<span class="t">' + e.at + '</span> ' +
    '<span class="k ' + e.kind + '">' + (KIND_CN[e.kind] || e.kind) + '</span>' + escapeHtml(e.text);
  box.appendChild(div);
  while (box.childElementCount > 300) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function tick(){
  try{
    const s = await (await fetch('/api/state')).json();
    render(s);
    const l = await (await fetch('/api/log?since=' + lastLogId)).json();
    (l.entries||[]).forEach(e=>{ lastLogId = Math.max(lastLogId, e.id); appendLog(e); });
  }catch(e){}
}
tick();
setInterval(tick, 1000);
</script>
</body>
</html>
