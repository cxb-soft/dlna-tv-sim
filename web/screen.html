<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>电视屏幕</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:none}
  #idle{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#5f7186;font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 40%,#101822,#04070b 70%)}
  #idle .tv{font-size:64px;opacity:.35;margin-bottom:14px}
  #hud{position:fixed;left:40px;bottom:36px;right:40px;display:flex;justify-content:space-between;
    align-items:flex-end;color:#e9eef5;font:13px/1.5 -apple-system,"PingFang SC",sans-serif;
    opacity:0;transition:opacity .4s;pointer-events:none}
  #hud .t{font-size:17px;text-shadow:0 2px 12px #000;max-width:70%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #hud .p{color:#b9c6d6;font-variant-numeric:tabular-nums;text-shadow:0 2px 12px #000}
  #pauseBadge{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:58px;
    color:rgba(255,255,255,.85);display:none;text-shadow:0 4px 24px #000}
  #tip{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);color:#8b98a9;
    font:12px/1.5 -apple-system,"PingFang SC",sans-serif;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<video id="v" playsinline></video>
<div id="idle">
  <div class="tv">📺</div>
  <div>等待投屏…</div>
  <div style="font-size:12px;color:#465468;margin-top:6px">在手机视频 App 里点“投屏”，选中这台电视</div>
</div>
<div id="pauseBadge">⏸</div>
<div id="hud"><div class="t" id="title"></div><div class="p" id="time"></div></div>
<div id="tip">点一下画面进入全屏；空格暂停</div>

<script src="/hls.min.js"></script>
<script>
const v = document.getElementById('v');
const idle = document.getElementById('idle');
const hud = document.getElementById('hud');
const tip = document.getElementById('tip');
const pauseBadge = document.getElementById('pauseBadge');
const titleEl = document.getElementById('title');
const timeEl = document.getElementById('time');

let curUri = '', hls = null, lastState = '', dragging = false;

function proxyUrl(u){ return '/proxy?url=' + encodeURIComponent(u); }
function fmt(sec){
  sec = Math.max(0, Math.floor(sec || 0));
  return [Math.floor(sec/3600), Math.floor(sec%3600/60), sec%60]
    .map(x => String(x).padStart(2,'0')).join(':');
}

function loadMedia(uri){
  curUri = uri;
  if (hls){ hls.destroy(); hls = null; }
  document.getElementById('pauseBadge').style.display = 'none';
  const src = proxyUrl(uri);
  const isHls = /\.m3u8(\?|$)/i.test(uri);
  if (isHls && window.Hls && Hls.isSupported()){
    hls = new Hls({enableWorker:false, lowLatencyMode:false});
    hls.loadSource(src);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data && data.fatal){ console.warn('hls error', data); }
    });
  } else {
    v.src = src;
  }
  v.style.display = 'block';
  idle.style.display = 'none';
}

function clearMedia(){
  curUri = '';
  if (hls){ hls.destroy(); hls = null; }
  v.pause();
  v.removeAttribute('src');
  v.load();
  v.style.display = 'none';
  idle.style.display = 'flex';
  pauseBadge.style.display = 'none';
  hud.style.opacity = 0;
}

function showTip(){
  tip.style.opacity = 1;
  setTimeout(()=> tip.style.opacity = 0, 4000);
}

function poke(){
  hud.style.opacity = 1;
  document.body.style.cursor = 'default';
  clearTimeout(window._hide);
  window._hide = setTimeout(()=>{
    if (!v.paused){ document.body.style.cursor = 'none'; hud.style.opacity = 0; }
  }, 3000);
}

document.addEventListener('mousemove', poke);
document.addEventListener('click', ()=>{
  if (!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }
});

async function tick(){
  let s;
  try { s = await (await fetch('/api/state')).json(); } catch(e){ return; }
  if (!s.uri){ clearMedia(); return; }
  if (s.uri !== curUri){ loadMedia(s.uri); showTip(); }
  titleEl.textContent = s.title || '';
  timeEl.textContent = fmt(s.position) + ' / ' + fmt(s.duration);
  v.volume = Math.max(0, Math.min(1, s.volume / 100));
  v.muted = !!s.mute;

  if (s.state === 'PLAYING'){
    if (v.paused) v.play().catch(()=>{});
    pauseBadge.style.display = 'none';
  } else if (s.state === 'PAUSED_PLAYBACK'){
    if (!v.paused) v.pause();
    pauseBadge.style.display = 'block';
  } else if (s.state === 'STOPPED'){
    v.pause();
  }
  if (lastState !== s.state) poke();
  lastState = s.state;
}

v.addEventListener('timeupdate', ()=>{
  if (!dragging && v.duration && isFinite(v.duration)){
    timeEl.textContent = fmt(v.currentTime) + ' / ' + fmt(v.duration);
  }
});

document.addEventListener('keydown', e=>{
  if (e.code === 'Space'){
    e.preventDefault();
    fetch('/api/control', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action: v.paused ? 'play' : 'pause'})});
  }
  if (e.key === 'f'){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }
});

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
