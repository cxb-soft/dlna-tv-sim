name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: build ${{ matrix.out }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin,  goarch: arm64, out: dlna-tv-sim-macos-arm64 }
          - { goos: darwin,  goarch: amd64, out: dlna-tv-sim-macos-amd64 }
          - { goos: windows, goarch: amd64, out: dlna-tv-sim-windows-x64.exe, native: true }
          - { goos: windows, goarch: arm64, out: dlna-tv-sim-windows-arm64.exe }
          - { goos: linux,   goarch: amd64, out: dlna-tv-sim-linux-amd64 }
          - { goos: linux,   goarch: arm64, out: dlna-tv-sim-linux-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Build
        if: ${{ matrix.native != true }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/${{ matrix.out }}" .
      - name: Install mingw-w64
        if: matrix.native
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 mingw-w64-tools \
            meson ninja-build pkg-config autoconf automake libtool
      - name: Fetch Windows native deps
        if: matrix.native
        run: ./scripts/fetch-win-deps.sh
      - name: Build native engine (console)
        if: matrix.native
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          STAGE: dist/win64-runtime
        run: ./scripts/build-windows-native.sh
      - name: Build native engine (windowsgui)
        if: matrix.native
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          GUI: "1"
          OUT: dist/engine/dlna-tv-sim.exe
          STAGE: dist/engine
        run: ./scripts/build-windows-native.sh
      - name: Upload native runtime DLLs
        if: matrix.native
        uses: actions/upload-artifact@v4
        with:
          name: win64-native-runtime
          path: dist/win64-runtime/*
          if-no-files-found: error
      - name: Upload app engine
        if: matrix.native
        uses: actions/upload-artifact@v4
        with:
          name: win64-app-engine
          path: dist/engine/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  # macOS .app 由 scripts/package-macos-app.sh 本地打包、公证后手动上传；
  # CI 不再跑这个必失败的可选 macOS runner job。
  windows-app:
    name: Windows app bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: windows-latest
    # 同 macos-app：拿不到完整的 Windows 工具链时不让整条工作流判红
    continue-on-error: true
    env:
      MPV_RELEASE: "20261111"
      MPV_COMMIT: "bcde6b93cc"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Download native engine (built on Linux with mingw)
        uses: actions/download-artifact@v4
        with:
          name: win64-app-engine
          path: dist/engine
      - name: Fetch mpv
        shell: pwsh
        run: |
          $base = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/$env:MPV_RELEASE"
          curl.exe -sSL -o mpv.7z "$base/mpv-x86_64-$env:MPV_RELEASE-git-$env:MPV_COMMIT.7z"
          7z x -y -ompv mpv.7z | Out-Null
          if (-not (Test-Path mpv\mpv.exe)) { throw "mpv.exe missing" }
      - name: Build Flutter app
        run: |
          cd ui
          flutter pub get
          flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $stage = "stage"
          Remove-Item -Recurse -Force $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Recurse "ui\build\windows\x64\runner\Release\*" $stage
          New-Item -ItemType Directory -Force -Path "$stage\engine" | Out-Null
          Copy-Item -Recurse "dist\engine\*" "$stage\engine\"
          if (-not (Test-Path "$stage\engine\SDL2.dll")) { throw "SDL2.dll missing from engine bundle" }
          if (-not (Test-Path "$stage\engine\libass-9.dll")) { throw "libass-9.dll missing from engine bundle" }
          Copy-Item -Recurse "uosc" "$stage\engine\uosc"
          New-Item -ItemType Directory -Force -Path "$stage\engine\mpv" | Out-Null
          Copy-Item "mpv\mpv.exe" "$stage\engine\mpv\"
          if (Test-Path "mpv\d3dcompiler_43.dll") { Copy-Item "mpv\d3dcompiler_43.dll" "$stage\engine\mpv\" }
          if (Test-Path "mpv\mpv\fonts.conf") { New-Item -ItemType Directory -Force -Path "$stage\engine\mpv\mpv" | Out-Null; Copy-Item "mpv\mpv\fonts.conf" "$stage\engine\mpv\mpv\" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage\*" -DestinationPath dist\dlna-tv-sim-windows-app.zip -Force
          Get-Item dist\dlna-tv-sim-windows-app.zip | Select-Object Length
      - uses: actions/upload-artifact@v4
        with:
          name: dlna-tv-sim-windows-app.zip
          path: dist/dlna-tv-sim-windows-app.zip
          if-no-files-found: error

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Windows 包里内置的 mpv（shinchiro 构建）；换版本时两个值一起改
      MPV_RELEASE: "20261111"
      MPV_COMMIT: "bcde6b93cc"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Fetch mpv for Windows
        run: |
          set -euo pipefail
          # 系统自带的 7z 版本太旧，解不开这个包，用官方 7zz
          curl -sSL -o 7zz.tar.xz "https://github.com/ip7z/7zip/releases/download/26.06/7z2606-linux-x64.tar.xz"
          tar -xf 7zz.tar.xz
          chmod +x 7zz
          base="https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/${MPV_RELEASE}"
          curl -sSL -o mpv-x64.7z "${base}/mpv-x86_64-${MPV_RELEASE}-git-${MPV_COMMIT}.7z"
          curl -sSL -o mpv-arm64.7z "${base}/mpv-aarch64-${MPV_RELEASE}-git-${MPV_COMMIT}.7z"
          ./7zz x -y -ompv-x64 mpv-x64.7z
          ./7zz x -y -ompv-arm64 mpv-arm64.7z
          test -f mpv-x64/mpv.exe
          test -f mpv-arm64/mpv.exe
      - name: Package
        run: |
          set -euo pipefail
          cd dist
          chmod +x dlna-tv-sim-macos-* dlna-tv-sim-linux-* || true
          cp ../README.md .
          cp ../README-Windows.txt .
          cp ../LICENSE-mpv.txt .
          cp "../启动电视.command" .
          chmod +x "启动电视.command"

          # Windows 包：exe + 说明 + 许可证 + 最小化 mpv（mpv\mpv.exe）
          stage_windows() {
            local arch="$1" mpvdir="$2"
            rm -rf "stage-$arch"
            mkdir -p "stage-$arch/mpv/mpv"
            cp "dlna-tv-sim-windows-$arch.exe" "stage-$arch/"
            cp README-Windows.txt LICENSE-mpv.txt "stage-$arch/"
            if [ "$arch" = "x64" ]; then
              # 自研播放核心的运行库（由 build 作业的 win64-native-runtime 提供）
              if compgen -G "*.dll" >/dev/null; then cp *.dll "stage-$arch/"; fi
              for f in LICENSE-*.txt COPYING.*; do
                if [ -f "$f" ]; then cp "$f" "stage-$arch/"; fi
              done
            fi
            cp "$mpvdir/mpv.exe" "stage-$arch/mpv/"
            if [ -f "$mpvdir/d3dcompiler_43.dll" ]; then
              cp "$mpvdir/d3dcompiler_43.dll" "stage-$arch/mpv/"
            fi
            if [ -f "$mpvdir/mpv/fonts.conf" ]; then
              cp "$mpvdir/mpv/fonts.conf" "stage-$arch/mpv/mpv/"
            fi
            (cd "stage-$arch" && zip -q -r "../dlna-tv-sim-windows-$arch.zip" .)
            unzip -l "dlna-tv-sim-windows-$arch.zip" | grep -q "mpv/mpv.exe"
            if [ "$arch" = "x64" ]; then
              unzip -l "dlna-tv-sim-windows-$arch.zip" | grep -q "SDL2.dll"
              unzip -l "dlna-tv-sim-windows-$arch.zip" | grep -q "avcodec-.*\.dll"
              # 字幕渲染：libass 与 4 个依赖 DLL
              for dll in libass- libfreetype- libfribidi- libharfbuzz- libunibreak-; do
                unzip -l "dlna-tv-sim-windows-$arch.zip" | grep -q "$dll" || {
                  echo "缺少字幕 DLL：$dll" >&2; return 1
                }
              done
              unzip -l "dlna-tv-sim-windows-$arch.zip" | grep -q "LICENSE-libass.txt"
            fi
            rm -rf "stage-$arch"
          }
          stage_windows x64 ../mpv-x64
          stage_windows arm64 ../mpv-arm64

          zip -q -j dlna-tv-sim-macos.zip dlna-tv-sim-macos-arm64 dlna-tv-sim-macos-amd64 "启动电视.command" README.md
          zip -q -j dlna-tv-sim-linux.zip dlna-tv-sim-linux-amd64 dlna-tv-sim-linux-arm64 README.md
          shasum -a 256 *.zip > SHA256SUMS.txt
          ls -lh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
